<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>내 차 소모품 점검 및 정비 예산 플래너</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <header class="site-header">
    <h1>내 차 소모품 점검 및 정비 예산 플래너</h1>
    <p class="subtitle">
      운전자가 주행거리에 맞춰 소모품 교체 필요 여부를 확인하고, 가용 예산과 정비 방식에 맞는 실행 계획을 세우는 서비스입니다.
    </p>
  </header>

  <main class="container">
    <section id="step1-section" class="card">
      <div class="step-badge">1단계: 상태 점검</div>
      <h2>소모품 상태 점검하기</h2>
      <p class="guide-text">점검할 소모품 종류를 고르고, 마지막 교체 이후 주행한 거리(km)를 입력해 주세요.</p>

      <div class="form-group">
        <label for="part-select">1. 점검할 소모품 선택</label>
        <select id="part-select">
          <option value="">-- 소모품을 선택하세요 --</option>
          <option value="oil">엔진오일 세트 (권장 주기: 10,000km / 기본 부품비: 45,000원)</option>
          <option value="coolant">냉각수·부동액 (권장 주기: 40,000km / 기본 부품비: 35,000원)</option>
          <option value="brake">브레이크 패드 (권장 주기: 30,000km / 기본 부품비: 60,000원)</option>
        </select>
      </div>

      <div class="form-group">
        <label for="mileage-input">2. 마지막 교체 후 주행거리 입력 (0 ~ 200,000 km)</label>
        <input type="number" id="mileage-input" placeholder="예: 12000" min="0" max="200000" />
      </div>

      <p id="step1-error" class="feedback-msg is-error is-hidden" role="alert"></p>

      <div class="btn-group">
        <button type="button" id="btn-check-step1" class="btn-primary">점검 결과 확인하기</button>
        <button type="button" id="btn-reset-step1" class="btn-outline">1단계 입력 지우기</button>
      </div>

      <div id="step1-result" class="result-box is-hidden" aria-live="polite">
        <h3 id="step1-result-title">점검 결과</h3>
        <p id="step1-result-desc"></p>
        <div class="btn-group">
          <button type="button" id="btn-go-step2" class="btn-accent">다음: 정비 방식 및 예산 시뮬레이션하기</button>
        </div>
      </div>
    </section>

    <section id="step2-section" class="card is-hidden" aria-live="polite">
      <div class="step-badge badge-new">2단계: 예산 시뮬레이션</div>
      <h2>정비 방식 선택 및 예산 시뮬레이션</h2>
      <p id="step2-context" class="context-banner"></p>
      <p class="guide-text">정비 방식을 선택하고 현재 사용할 수 있는 예산을 입력하면, 진행 가능 여부와 실행 체크리스트를 만들어 드립니다.</p>

      <div class="form-group">
        <label for="method-select">1. 희망하는 정비 방식 선택</label>
        <select id="method-select">
          <option value="shop">정비소 방문 교체 (부품비 + 공임비 40,000원 추가)</option>
          <option value="diy">셀프 정비 DIY (부품비 + 공구 대여비 10,000원 추가)</option>
        </select>
      </div>

      <div class="form-group">
        <label for="budget-input">2. 내 가용 예산 입력 (10,000원 ~ 500,000원 사이 숫자만 입력)</label>
        <input type="number" id="budget-input" placeholder="예: 80000" min="10000" max="500000" step="1000" />
      </div>

      <p id="step2-error" class="feedback-msg is-error is-hidden" role="alert"></p>

      <div class="btn-group">
        <button type="button" id="btn-run-sim" class="btn-primary">예산 조건 확인 및 계획 생성</button>
        <button type="button" id="btn-cancel-sim" class="btn-secondary">예산 계산 취소하기</button>
      </div>

      <div id="step2-result" class="result-box is-hidden">
        <h3 id="step2-result-title">시뮬레이션 결과</h3>
        <p id="step2-result-desc"></p>
        <ul id="step2-checklist" class="checklist is-hidden"></ul>

        <div class="btn-group next-actions">
          <button type="button" id="btn-edit-step2" class="btn-outline">예산·방식 다시 수정 (입력값 유지)</button>
          <button type="button" id="btn-back-step1" class="btn-outline">1단계로 돌아가기 (기존 값 유지)</button>
          <button type="button" id="btn-reset-all" class="btn-danger">처음부터 다시 시작 (전체 초기화)</button>
        </div>
      </div>
    </section>
  </main>

  <script src="script.js"></script>
</body>
</html>
